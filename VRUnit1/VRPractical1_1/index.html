<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!--Elena Ermakova-->
      <a-box position="0 2 -1" rotation="0 90 0" width="4" height="2" depth="2.5" color="purple"></a-box>
      <a-box position="0 4 -1" rotation="0 90 0" width="2" height="2" depth ="2" src="lambo.jpg"> </a-box>
      <a-box position="0 2 -2" rotation="0 90 0" width="2.5" height="1" depth="2" color="blue"></a-box>
      <a-box position="0 2 0" rotation="0 90 0" width="2.5" height="1" depth="2" color="blue"></a-box>
      <a-box position="1 2 -1" rotation="0 90 0" width="3" height="1" depth="1" color="blue"></a-box>
      <a-box position="-1 2 -1" rotation="0 90 0" width="3" height="1" depth="1" color="blue"></a-box>

      <a-cylinder position="1 0.5 -2.5" radius="0.5" height="0.5" color="black" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="1 0.5 0.5" radius="0.5" height="0.5" color="black" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="-1 0.5 -2.5" radius="0.5" height="0.5" color="black" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="-1 0.5 0.5" radius="0.5" height="0.5" color="black" rotation="90 0 90"></a-cylinder>
      
      <a-cylinder position="-1 0.5 0.5" radius="0.25" height="0.75" color="gray" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="1 0.5 0.5" radius="0.25" height="0.75" color="gray" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="-1 0.5 -2.5" radius="0.25" height="0.75" color="gray" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="1 0.5 -2.5" radius="0.25" height="0.75" color="gray" rotation="90 0 90"></a-cylinder>

      <a-box position="10 2 -1" rotation="0 90 0" width="4" height="2" depth="2.5" color="red"></a-box>
      <a-box position="10 4 -1" rotation="0 90 0" width="2" height="2" depth ="2" src="lambo.jpg"> </a-box>
      <a-box position="10 2 -2" rotation="0 90 0" width="2.5" height="1" depth="2" color="blue"></a-box>
      <a-box position="10 2 0" rotation="0 90 0" width="2.5" height="1" depth="2" color="blue"></a-box>
      <a-box position="11 2 -1" rotation="0 90 0" width="3" height="1" depth="1" color="blue"></a-box>
      <a-box position="9 2 -1" rotation="0 90 0" width="3" height="1" depth="1" color="blue"></a-box>

      <a-cylinder position="11 0.5 -2.5" radius="0.5" height="0.5" color="black" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="11 0.5 0.5" radius="0.5" height="0.5" color="black" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="9 0.5 -2.5" radius="0.5" height="0.5" color="black" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="9 0.5 0.5" radius="0.5" height="0.5" color="black" rotation="90 0 90"></a-cylinder>
      
      <a-cylinder position="9 0.5 0.5" radius="0.25" height="0.75" color="gray" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="11 0.5 0.5" radius="0.25" height="0.75" color="gray" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="9 0.5 -2.5" radius="0.25" height="0.75" color="gray" rotation="90 0 90"></a-cylinder>
      <a-cylinder position="11 0.5 -2.5" radius="0.25" height="0.75" color="gray" rotation="90 0 90"></a-cylinder>

      <a-box position="50 1 50" rotation="0 0 0" width="20" height="30" depth="20" color="white"> </a-box>

      <a-plane 
        position="1 0 0" 
        rotation="-90 0 0" 
        width="60" height="60" 
        src="road.avif">
    </a-plane>
      
      <a-sky src="image.png" repeat="15 15"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
